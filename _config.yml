title: Júlio Henkes
description: "Offensive Security · Cyber Intelligence — writeups, evasion, exploit dev, and dossiers by Júlio Henkes."
url: "https://juliohenkes.github.io"
baseurl: ""
lang: en
author: Júlio Henkes

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

exclude:
  - convert_writeups.py
  - "*.py"
  - "*.sh"
  - writeup.bkp/
  - Gemfile
  - Gemfile.lock
  - musica/
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: page

  - scope:
      path: "evasion"
      type: pages
    values:
      layout: cyber
      section: evasion
  - scope:
      path: "exploit-dev"
      type: pages
    values:
      layout: cyber
      section: exploit-dev
  - scope:
      path: "methodology"
      type: pages
    values:
      layout: cyber
      section: methodology
  - scope:
      path: "toolkit"
      type: pages
    values:
      layout: cyber
      section: toolkit
  - scope:
      path: "writeups"
      type: pages
    values:
      layout: writeup

  - scope:
      path: "evasion/index.md"
    values:
      layout: page
  - scope:
      path: "exploit-dev/index.md"
    values:
      layout: page
  - scope:
      path: "methodology/index.md"
    values:
      layout: page
  - scope:
      path: "toolkit/index.md"
    values:
      layout: page
  - scope:
      path: "writeups/index.md"
    values:
      layout: page
  - scope:
      path: "observatory/index.md"
    values:
      layout: page
